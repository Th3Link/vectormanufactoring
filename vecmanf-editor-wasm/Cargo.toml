[package]
name = "vecmanf-editor-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin wasm-bindgen facade binding vecmanf-document-core, vecmanf-ui-core and vecmanf-render-core, owning the wgpu device/surface and GPU submission (ADR 0001 §3)."

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
vecmanf-document-core = { path = "../vecmanf-document-core", version = "0.1.0" }
vecmanf-ui-core = { path = "../vecmanf-ui-core", version = "0.1.0" }
vecmanf-render-core = { path = "../vecmanf-render-core", version = "0.1.0" }

[dev-dependencies]
# `tests/acceptance_0005.rs` counts Loro changes / reads op keys to verify
# "one interaction = one commit" and the per-register write table.
loro.workspace = true

# `session.rs` (this crate's actual orchestration logic) is plain Rust,
# host-independent and tested by ordinary `cargo test`. Everything below
# is wasm32-only: the `wasm-bindgen` surface and the `wgpu` device/
# surface/GPU submission it owns (ADR 0001 §3) are both meaningless on
# the host and would need a browser or a GPU driver to even construct.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wgpu = { version = "30", default-features = false, features = ["webgl", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]
