# CI gate for the whole repository: the Rust workspace and the frontend.
#
# Job shape (ADR 0011 §6-§7, docs/guides/rust-workspace-blueprint.md §4,
# CLAUDE.md §7-§8). Grouped by what each job actually needs to run, not by
# crate identity, so adding a crate is a one-line matrix edit (or, for
# core-wasm32, no edit at all — see its own comment):
#
#   frontend          — frontend/'s own gate (tsc, oxlint, npm audit/license),
#                        ubuntu only (plain JS/TS tooling, nothing
#                        platform-specific). Also produces frontend/dist,
#                        which curvyo-app's build needs (tauri::
#                        generate_context! fails without it — confirmed
#                        locally; see rust-host-gate/doc below), so every job
#                        that builds curvyo-app depends on this one and
#                        downloads its dist/ artifact instead of rebuilding
#                        the frontend per OS.
#   rust-host-gate    — the full host gate (fmt, clippy, nextest) over the
#                        *whole workspace*, matrixed over ubuntu/windows/
#                        macos. Originally this was meant to be scoped to just
#                        curvyo-app's dependency closure (ADR 0011 §7), with
#                        a separate ubuntu-only `core-host` job for the rest —
#                        dropped: hand-maintained crate lists silently go
#                        stale, and `--workspace` isn't actually more
#                        expensive on windows/macos here (every crate in the
#                        workspace already builds clean on all three, so
#                        there was nothing the split was buying beyond fewer
#                        CPU-minutes on two platforms Tauri's own code
#                        dominates the runtime of anyway).
#   core-wasm32       — one job per workspace member whose name ends in
#                        `-core`, plus `curvyo-editor-wasm` (see its own
#                        comment) — discovered via `cargo metadata`, not
#                        hardcoded, so a new `*-core` crate is picked up with
#                        no workflow edit at all. Builds for
#                        wasm32-unknown-unknown, lints it, and asserts the
#                        ADR 0011 §6 dependency ban list. Ubuntu only, per the
#                        ADR.
#   boolean-budgets   — the boolean kernel's performance budgets in a release build, ubuntu only.
#   deny              — `cargo deny check`, once, over the whole workspace
#                        (ADR 0011 §7: not matrixed — it inspects the
#                        dependency graph, not compiled code, so one run
#                        sees everything every OS would).
#   doc               — `cargo doc`, once, over the whole workspace, same
#                        reasoning as `deny`. Needs frontend/dist for the
#                        same reason rust-host-gate does: cargo doc expands
#                        curvyo-app's proc macros too.
#
# Toolchain: every job reads the exact version pinned in the repo's
# `rust-toolchain.toml` (currently 1.99.0, with the `rustfmt`/`clippy`
# components and the `wasm32-unknown-unknown` target already declared there)
# via plain `rustup show`, rather than a `dtolnay/rust-toolchain@stable`
# step — that action's `@stable` ref installs whatever the *current* stable
# release is and ignores the repo's pin, which is exactly how this workflow's
# first real run got 1.99.0 against a local verification done on 1.98.1 and
# went red on a clippy lint that only exists in the newer compiler. Pinning
# stops that: Renovate bumps `rust-toolchain.toml` deliberately, as its own
# reviewable PR, instead of every CI run silently floating to whatever
# "stable" means that day.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # frontend/ is not a workspace member (ADR 0011 §5) and gets its own gate:
  # tsc, the lint tool actually configured (oxlint, not ESLint — ADR 0011 §5
  # assumed ESLint; CLAUDE.md §8 already names oxlint as the accepted
  # substitute), and an npm license/audit check since `cargo deny` cannot see
  # npm dependencies (ADR 0006 §2). No Prettier config exists in frontend/
  # today, so no Prettier step is added — adding one unconfigured would check
  # nothing.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Needed to build curvyo-editor-wasm for the browser (build:wasm
      # below) — the frontend imports its wasm-bindgen output as an ES
      # module, so this job's gate (tsc, oxlint) would otherwise fail on a
      # missing module, same as building curvyo-app without this job's
      # dist/ output. `rustup show` installs/activates the toolchain pinned
      # in rust-toolchain.toml (components and wasm32 target included) —
      # see the file header on why no separate toolchain action is used.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Install wasm-bindgen CLI matching Cargo.lock
        # wasm-bindgen's CLI and crate versions must match exactly
        # (frontend/scripts/build-wasm.sh's own comment) — read the crate
        # version out of the lockfile instead of hand-pinning a second copy
        # that can drift when Renovate bumps the crate.
        run: |
          set -euo pipefail
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "wasm-bindgen crate version: $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the wasm-bindgen JS bindings
        working-directory: frontend
        run: npm run build:wasm

      - name: Type-check (tsc)
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (node:test)
        # The pure modifier-key tracking (`src/lib/keyModifiers.ts`) runs on
        # Node's own test runner with type stripping: no test dependency.
        working-directory: frontend
        run: npm test

      - name: Build (produces frontend/dist)
        working-directory: frontend
        run: npm run build

      - name: npm license check
        # Mirrors deny.toml's allow-list (ADR 0006 §2) plus permissive
        # licenses that are genuinely present in the npm tree but don't occur
        # in the Rust one: Python-2.0 (argparse, a transitive CLI dep),
        # CC-BY-4.0 (caniuse-lite's data file), BlueOak-1.0.0 (isaacs'
        # isexe/minimatch) and 0BSD — all permissive, OSI-approved/FSF-free,
        # none copyleft. "Apache-2.0 OR MIT" and "(MIT OR CC0-1.0)" are
        # dual-license SPDX expressions where either side is already
        # allowed; license-checker treats them as one opaque string, so they
        # are listed verbatim rather than split. --excludePrivatePackages
        # drops our own `frontend` package (private, AGPL-3.0-or-later,
        # like deny.toml's exceptions for our own crates) from the scan.
        # Version pinned (tested against this exact tree); bump deliberately.
        working-directory: frontend
        run: |
          npx --yes license-checker-rseidelsohn@5.0.1 \
            --excludePrivatePackages \
            --onlyAllow 'MIT;Apache-2.0;Apache-2.0 WITH LLVM-exception;BSD-2-Clause;BSD-3-Clause;ISC;Unicode-3.0;Zlib;MPL-2.0;CC0-1.0;BSL-1.0;Apache-2.0 OR MIT;(MIT OR CC0-1.0);Python-2.0;CC-BY-4.0;BlueOak-1.0.0;0BSD' \
            --summary

      - name: npm audit
        # --high: fail on high/critical. The one current allowlisted
        # advisory (GHSA-vfj7-8cjw-p6xm, "braces" stack-exhaustion DoS, via
        # shadcn's own fast-glob/micromatch toolchain — a component
        # scaffolding CLI, not code the shipped app executes) predates this
        # workflow, is not ours to fix in a CI-only change, and is recorded
        # in docs/technical-debt.md. audit-ci's --allowlist mirrors
        # deny.toml's advisories.ignore pattern: a documented, narrow
        # exception, not a weakened check — any *other* high/critical
        # advisory still fails this step. Version pinned; bump deliberately.
        working-directory: frontend
        run: |
          npx --yes audit-ci@7.1.0 --high --allowlist GHSA-vfj7-8cjw-p6xm

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # The full host gate (fmt, clippy, nextest) over the whole workspace,
  # matrixed across the three desktop OSes because curvyo-app (Tauri)
  # carries platform-specific webview/windowing code. See the file header
  # for why this replaced a narrower curvyo-app-only job plus a separate
  # core-host job.
  rust-host-gate:
    name: rust-host-gate (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # curvyo-app (Tauri) links against the system GTK/WebKitGTK stack on
      # Linux at build time — `cargo clippy`/`cargo build` need it present
      # even though this job never packages a bundle. Not needed on
      # windows-latest/macos-latest, which use the OS's own native webview.
      - name: Install Tauri's Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --message-format=short -- -D warnings

      - name: cargo nextest
        run: cargo nextest run --workspace --status-level fail

  # Discovers the crates core-wasm32 below runs against, instead of a
  # hand-maintained list that silently misses a new crate: every workspace
  # member whose name ends in `-core`, plus `curvyo-editor-wasm` (see that
  # job's comment for why it's included by name rather than by suffix).
  discover-core-crates:
    name: discover core crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - id: list
        run: |
          set -euo pipefail
          crates=$(cargo metadata --no-deps --format-version=1 \
            | jq -c '[.packages[].name | select(endswith("-core") or . == "curvyo-editor-wasm")]')
          echo "Discovered: $crates"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

  # ADR 0011 §6: every *-core crate builds for wasm32-unknown-unknown, and CI
  # asserts *which* dependency would silently break that build rather than
  # only noticing that it broke. Ubuntu only, per ADR 0011 §7.
  #
  # curvyo-editor-wasm is included alongside the `*-core` crates (added to
  # discover-core-crates' output by exact name, since it doesn't end in
  # `-core`) even though it is explicitly allowed to depend on
  # wasm-bindgen/browser APIs (ADR 0001 §3): wasm32 is its only real target
  # (crate-type cdylib), so it needs the build and lint legs regardless, and
  # the ban list itself (rayon, tokio, reqwest, keyring, gix/gitoxide, mio,
  # socket2) names nothing a "no logic of its own" wasm-bindgen facade should
  # ever legitimately need either — the check is free to run and catches the
  # same class of mistake. Verified clean (see PR description); its
  # `gpu.rs`/`wasm_api.rs` are wasm32-only and otherwise never linted at all
  # (host clippy skips `cfg(target_arch = "wasm32")` code), which is why this
  # job lints on this target instead of only building.
  #
  # Known, deliberately out of scope here: `curvyo-document-core` pulls
  # `getrandom`'s `js`-enabled path via `loro` (docs/technical-debt.md,
  # "`curvyo-document-core` needs a JavaScript host on `wasm32`"). That
  # entry's own text says this ban-list is "the wrong instrument" for it —
  # the build succeeds, so a tree-presence check for a *different*,
  # undecided set of names is a separate piece of work for the plugin-host
  # story, not this one. (`getrandom` is also a real demonstration of why the
  # ban-list check below reads the whole tree instead of querying each name
  # with `cargo tree -i`: it resolves to three versions in this workspace,
  # and `-i getrandom` errors "specification is ambiguous" rather than
  # answering present-or-absent.)
  core-wasm32:
    name: core-wasm32 (${{ matrix.crate }})
    needs: discover-core-crates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.discover-core-crates.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --target wasm32-unknown-unknown
        run: cargo build -q --target wasm32-unknown-unknown -p ${{ matrix.crate }}

      - name: cargo clippy --target wasm32-unknown-unknown
        run: cargo clippy --target wasm32-unknown-unknown -p ${{ matrix.crate }} --message-format=short -- -D warnings

      - name: Assert the dependency ban list is empty
        # `cargo tree --target wasm32-unknown-unknown -p $crate -i $dep` is
        # NOT used here, deliberately — it has two failure modes that look
        # like "clean" but aren't:
        #   1. It exits 0 both for a real match and for "this package exists
        #      somewhere in the lockfile but not in this crate's
        #      target-filtered tree" (an empty-stdout "nothing to print"
        #      warning on stderr) — exit code alone doesn't distinguish them.
        #   2. When a banned name resolves to two or more versions in
        #      Cargo.lock (common for small utility crates — getrandom does
        #      right now, at three), `-i <name>` refuses with "specification
        #      `<name>` is ambiguous" instead of answering present-or-absent.
        # Both were caught on this crate (`cargo tree -i` on a reintroduced
        # `rayon` correctly failed; `-i getrandom` demonstrates mode 2 —
        # see the job comment). The fix: ask for the crate's whole normal
        # dependency tree once, flattened, and grep it ourselves — no
        # per-name query, so no per-name ambiguity error to swallow or miss.
        run: |
          set -euo pipefail
          crate="${{ matrix.crate }}"
          tree_output=$(cargo tree --target wasm32-unknown-unknown -p "$crate" -e normal --prefix none --format '{p}')
          # gitoxide is the *project* name (ADR 0011 §6); its crate is `gix`.
          if echo "$tree_output" | grep -E '^(rayon|tokio|reqwest|keyring|gitoxide|gix|mio|socket2) v'; then
            echo "::error::$crate pulls a banned dependency into its wasm32-unknown-unknown tree (see the match above)"
            exit 1
          fi
          echo "$crate: clean"

  # The boolean kernel's performance budgets (specs/0016-boolean-operations criteria 44, 45) are
  # defined for a release build; the host gate above builds debug, where the tests only print.
  # The kernel's budgets, the document write and edits of a big result, and the editor frame of a
  # drag over one; ubuntu only, so it stays cheap.
  boolean-budgets:
    name: boolean budgets (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Run the boolean performance tests in release
        run: |
          cargo test --release -p curvyo-geometry-core --test boolean_performance -- --nocapture
          cargo test --release -p curvyo-document-core --test compound_write_cost -- --nocapture
          cargo test --release -p curvyo-editor-wasm --test compound_path_interactivity -- --nocapture

  # Dependency-graph/license check, not compiled code — one run sees every
  # target deny.toml's [graph] lists (including wasm32-unknown-unknown),
  # so this does not need an OS matrix (ADR 0011 §7).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - uses: Swatinem/rust-cache@v2

      - run: cargo deny check

  # `cargo doc` over the whole workspace, once (ADR 0011 §7, same reasoning
  # as `deny`). Needs frontend/dist for the same reason rust-host-gate
  # does — `cargo doc` expands `curvyo-app`'s `tauri::generate_context!`
  # too, confirmed locally (it is not exempt just because it doesn't link) —
  # and the same Linux system libraries for the same reason.
  doc:
    name: cargo doc
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -q --workspace --no-deps
