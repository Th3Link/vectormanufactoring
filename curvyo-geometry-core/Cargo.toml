[package]
name = "curvyo-geometry-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Curvyo geometry kernel: hit-test geometry over cubic Bézier segments and boolean operations on closed outlines (pure, wasm-compatible)."

[lints]
workspace = true

[dependencies]
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
kurbo.workspace = true
i_overlay.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Not built for wasm32 (it needs OS facilities there; the wasm build runs the golden test only).
# Test-only (tester-added, `specs/0002-path-node-editing` verification): property
# tests for the geometry kernel's flatten/nearest-point/subdivide invariants
# (`CLAUDE.md`'s tester role, "Geometry ... property tests with proptest").
proptest = "1"

# The golden results are also compared in the wasm build, in Node, by `wasm-bindgen-test-runner`
# (`tests/boolean_golden_wasm.rs`, criterion 43 of `specs/0016-boolean-operations`). Same
# release train as the `wasm-bindgen` crate the facade uses; MIT OR Apache-2.0.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
