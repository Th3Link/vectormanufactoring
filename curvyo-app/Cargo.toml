[package]
name = "curvyo-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Tauri 2 desktop host: native menu, native file dialogs, the .curvyo file association, and platform I/O behind a narrow command interface (ADR 0001 §6, ADR 0011 §2)."

[lints]
workspace = true

[features]
# Standard Tauri 2 scaffold block: without this, a release binary falls
# back to connecting to the Vite dev server (tauri.conf.json's `devUrl`)
# instead of serving the bundled frontend, which breaks AC1 (empty canvas
# never appears) and would break AC8/AC9 the moment no dev server is
# reachable, which is every real user's machine.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = ["config-json"] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "common-controls-v6",
    "compression",
    "dbus",
    "dynamic-acl",
    "tauri-runtime-wry",
    "webkit2gtk",
    "webview2-com",
    "wry",
    "x11",
] }
tauri-plugin-dialog = "2"
# A fresh Loro peer id per open session (specs/0001-project-file-foundation/
# adrs.md, amended 2026-10-03) is minted by the frontend itself now
# (`frontend/src/lib/editorSession.ts`'s `mintPeerId`, the browser's own
# CSPRNG) — `path-node-editing`'s PR review moved Open/Save so the only
# document any session touches is the frontend's own `WasmSession`; this
# host no longer builds a `curvyo_document_core::Document` at all, so it
# has no peer id of its own left to mint.
serde.workspace = true
serde_json.workspace = true
curvyo-storage-io = { path = "../curvyo-storage-io", version = "0.1.0" }
