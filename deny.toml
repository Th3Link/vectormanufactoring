# cargo-deny configuration. License allow-list per ADR 0006 §2 — anything
# else fails CI and needs a decision, not a waiver.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Not in ADR 0006 §2's original list; added here as this slice's one
    # license decision (CLAUDE.md §5: justified in the PR). Permissive,
    # OSI-approved and FSF-free, strictly more permissive than MIT, and
    # therefore AGPL-3.0-compatible. Pulled in transitively by `loro`
    # (xxhash-rust).
    "BSL-1.0",
]
confidence-threshold = 0.9

# This workspace's own crates are AGPL-3.0-or-later (ADR 0006 §1), which is
# deliberately not in the allow-list above — that list vets third-party
# dependencies, not this project's own chosen license.
[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "vecmanf-document-core"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "vecmanf-storage-io"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "vecmanf-app"

# path-node-editing's four new crates (specs/path-node-editing/adrs.md:
# "the four new crate manifests... carry AGPL-3.0-or-later").
[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "vecmanf-geometry-core"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "vecmanf-ui-core"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "vecmanf-render-core"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "vecmanf-editor-wasm"

[advisories]
# "Unmaintained" advisories with no safe upgrade available, from
# dependencies we don't control (`loro`'s and Tauri's own trees). Not
# security vulnerabilities. Recorded in `docs/technical-debt.md`
# ("Four transitive dependencies are unmaintained, with no safe upgrade");
# revisit at each `loro`/`tauri` upgrade.
ignore = [
    "RUSTSEC-2026-0248", # im, via loro-internal
    "RUSTSEC-2026-0251", # sized-chunks, via loro-internal -> im
    "RUSTSEC-2026-0247", # bitmaps, via loro-internal -> im
    "RUSTSEC-2024-0370", # proc-macro-error, via Tauri's Linux gtk-rs stack
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
